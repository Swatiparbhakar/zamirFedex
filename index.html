<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generate FedEx Label</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
  :root {
    --ink: #1a2233;
    --ink-soft: #5b6472;
    --line: #dde1e7;
    --line-soft: #eef0f3;
    --bg: #ffffff;
    --accent: #4d3df7;
    --accent-soft: #ecebff;
    --error: #c4432b;
    --success: #1a7f4b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 24px 26px;
  }

  h1 {
    font-size: 18px;
    font-weight: 650;
    margin: 0 0 4px;
  }

  .subtitle {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  .order-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--line-soft);
    border-radius: 6px;
    padding: 4px 9px;
    margin-bottom: 20px;
  }

  .order-tag strong { color: var(--ink); font-weight: 600; }

  form { display: flex; flex-direction: column; gap: 16px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  select, input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14.5px;
    color: var(--ink);
    background: #fff;
    outline: none;
    font-family: inherit;
  }

  select:focus, input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .weight-row { display: flex; gap: 10px; }
  .weight-row .weight-input { flex: 2; }
  .weight-row .weight-unit { flex: 1; }

  button {
    margin-top: 4px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }

  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button:hover:not(:disabled) { background: #000; }

  .message {
    margin-top: 16px;
    font-size: 13.5px;
    padding: 12px 14px;
    border-radius: 8px;
    display: none;
    line-height: 1.5;
  }

  .message.visible { display: block; }
  .message.error { background: #fdeceb; color: var(--error); }
  .message.success { background: #eaf7ef; color: var(--success); }

  .spinner {
    display: none;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 12px;
  }

  .spinner.visible { display: block; }
</style>
</head>
<body>

  <h1>Generate FedEx shipping label</h1>
  <p class="subtitle">Confirm service and package details, then generate the label and tracking number.</p>

  <div class="order-tag" id="orderTag" style="display:none;">
    Order <strong id="orderIdValue"></strong>
  </div>

  <form id="shipmentForm" novalidate>
    <div class="field">
      <label for="service_type">FedEx service type</label>
      <select id="service_type" required>
        <option value="" disabled selected>Select a service</option>
        <option value="FEDEX_GROUND">FedEx Ground</option>
        <option value="FEDEX_HOME_DELIVERY">FedEx Home Delivery</option>
        <option value="FEDEX_EXPRESS_SAVER">FedEx Express Saver</option>
        <option value="FEDEX_2_DAY">FedEx 2Day</option>
        <option value="FEDEX_2_DAY_AM">FedEx 2Day A.M.</option>
        <option value="STANDARD_OVERNIGHT">FedEx Standard Overnight</option>
        <option value="PRIORITY_OVERNIGHT">FedEx Priority Overnight</option>
        <option value="FIRST_OVERNIGHT">FedEx First Overnight</option>
        <option value="INTERNATIONAL_ECONOMY">FedEx International Economy</option>
        <option value="INTERNATIONAL_PRIORITY">FedEx International Priority</option>
      </select>
    </div>

    <div class="field">
      <label for="weight">Package weight</label>
      <div class="weight-row">
        <input type="number" id="weight" class="weight-input" min="0.01" step="0.01" placeholder="e.g. 2.5" required />
        <select id="weight_unit" class="weight-unit" required>
          <option value="LB">lb</option>
          <option value="KG">kg</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="package_type">Packaging type</label>
      <select id="package_type" required>
        <option value="" disabled selected>Select packaging</option>
        <option value="YOUR_PACKAGING">Your packaging</option>
        <option value="FEDEX_ENVELOPE">FedEx Envelope</option>
        <option value="FEDEX_BOX">FedEx Box</option>
        <option value="FEDEX_SMALL_BOX">FedEx Small Box</option>
        <option value="FEDEX_MEDIUM_BOX">FedEx Medium Box</option>
        <option value="FEDEX_LARGE_BOX">FedEx Large Box</option>
        <option value="FEDEX_PAK">FedEx Pak</option>
        <option value="FEDEX_TUBE">FedEx Tube</option>
      </select>
    </div>

    <button type="submit" id="submitBtn">Generate label</button>
    <div class="spinner" id="spinner">Talking to FedEx&hellip; this can take a few seconds.</div>
  </form>

  <div class="message" id="resultMessage"></div>

<script>
  let currentOrderId = null;

  // 1. Initialize the Zoho Widget SDK and read the record we were opened from.
  ZOHO.embeddedApp.on("PageLoad", function (data) {
    // data.EntityId is the ID of the record the button was clicked on (the Order).
    currentOrderId = Array.isArray(data.EntityId) ? data.EntityId[0] : data.EntityId;
    if (currentOrderId) {
      document.getElementById("orderTag").style.display = "inline-flex";
      document.getElementById("orderIdValue").textContent = currentOrderId;
    }
  });

  ZOHO.embeddedApp.init();

  const form = document.getElementById("shipmentForm");
  const submitBtn = document.getElementById("submitBtn");
  const spinner = document.getElementById("spinner");
  const resultMessage = document.getElementById("resultMessage");

  function showMessage(text, type) {
    resultMessage.textContent = text;
    resultMessage.className = "message visible " + type;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    if (!currentOrderId) {
      showMessage("Could not detect the order this widget was opened from. Reopen it from the Order record.", "error");
      return;
    }

    const service_type = document.getElementById("service_type").value;
    const weight = document.getElementById("weight").value;
    const weight_unit = document.getElementById("weight_unit").value;
    const package_type = document.getElementById("package_type").value;

    if (!service_type || !weight || parseFloat(weight) <= 0 || !package_type) {
      showMessage("Please fill in every field with a valid value.", "error");
      return;
    }

    submitBtn.disabled = true;
    spinner.classList.add("visible");
    resultMessage.classList.remove("visible");

    // 2. Call your Deluge function directly through the SDK.
    // "GenerateFedexShippingLabel1" must match the function's API name in Zoho.
    const req = {
      functionname: "generatefedexshippinglabel1_1",
      arguments: {
        order_id: currentOrderId,
        service_type: service_type,
        weight: parseFloat(weight),
        weight_unit: weight_unit,
        package_type: package_type
      }
    };

    ZOHO.CRM.FUNCTIONS.execute(req.functionname, req.arguments)
      .then(function (response) {
        submitBtn.disabled = false;
        spinner.classList.remove("visible");

        // response.details.output holds whatever your Deluge "return" statement sent back.
        const output = response && response.details ? response.details.output : response;

        if (typeof output === "string" && output.toLowerCase().indexOf("error") !== -1) {
          showMessage(output, "error");
        } else if (typeof output === "string" && output.toLowerCase().indexOf("already exist") !== -1) {
          showMessage(output, "error");
        } else {
          showMessage(output || "Label generated.", "success");
        }
      })
      .catch(function (err) {
        submitBtn.disabled = false;
        spinner.classList.remove("visible");
        showMessage("Something went wrong calling the function: " + JSON.stringify(err), "error");
      });
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Generate FedEx Labels</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
  :root {
    --ink: #1a2233;
    --ink-soft: #5b6472;
    --line: #dde1e7;
    --line-soft: #eef0f3;
    --bg: #ffffff;
    --accent: #4d3df7;
    --accent-soft: #ecebff;
    --error: #c4432b;
    --success: #1a7f4b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 24px 26px;
  }

  h1 { font-size: 18px; font-weight: 650; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; }

  .order-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: var(--line-soft);
    border-radius: 6px;
    padding: 4px 9px;
    margin-bottom: 20px;
  }

  .order-tag strong { color: var(--ink); font-weight: 600; }

  form { display: flex; flex-direction: column; gap: 18px; }

  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }

  select, input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14.5px;
    color: var(--ink);
    background: #fff;
    outline: none;
    font-family: inherit;
  }

  select:focus, input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .packages-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .packages-header label { margin-bottom: 0; }

  .add-package-btn {
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  .add-package-btn:hover { background: #e0deff; }

  .package-row {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
  }

  .package-row .package-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: none;
  }

  .weight-row { display: flex; gap: 10px; }
  .weight-row .weight-input { flex: 2; }
  .weight-row .weight-unit { flex: 1; }

  .remove-package-btn {
    align-self: flex-end;
    background: none;
    border: none;
    color: var(--error);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 4px;
  }

  .remove-package-btn:hover { text-decoration: underline; }

  button[type="submit"] {
    margin-top: 4px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }

  button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
  button[type="submit"]:hover:not(:disabled) { background: #000; }

  .message {
    margin-top: 16px;
    font-size: 13.5px;
    padding: 12px 14px;
    border-radius: 8px;
    display: none;
    line-height: 1.5;
    white-space: pre-line;
  }

  .message.visible { display: block; }
  .message.error { background: #fdeceb; color: var(--error); }
  .message.success { background: #eaf7ef; color: var(--success); }

  .spinner { display: none; font-size: 13px; color: var(--ink-soft); margin-top: 12px; }
  .spinner.visible { display: block; }
</style>
</head>
<body>

  <h1>Generate FedEx shipping labels</h1>
  <p class="subtitle">Add one row per package. Each package gets its own tracking number and label.</p>

  <div class="order-tag" id="orderTag" style="display:none;">
    Order <strong id="orderIdValue"></strong>
  </div>

  <form id="shipmentForm" novalidate>
    <div class="field">
      <label for="service_type">FedEx service type <span style="font-weight:400;color:var(--ink-soft);">(applies to whole shipment)</span></label>
      <select id="service_type" required>
        <option value="" disabled selected>Select a service</option>
        <option value="FEDEX_GROUND">FedEx Ground</option>
        <option value="FEDEX_HOME_DELIVERY">FedEx Home Delivery</option>
        <option value="FEDEX_EXPRESS_SAVER">FedEx Express Saver</option>
        <option value="FEDEX_2_DAY">FedEx 2Day</option>
        <option value="FEDEX_2_DAY_AM">FedEx 2Day A.M.</option>
        <option value="STANDARD_OVERNIGHT">FedEx Standard Overnight</option>
        <option value="PRIORITY_OVERNIGHT">FedEx Priority Overnight</option>
        <option value="FIRST_OVERNIGHT">FedEx First Overnight</option>
        <option value="INTERNATIONAL_ECONOMY">FedEx International Economy</option>
        <option value="INTERNATIONAL_PRIORITY">FedEx International Priority</option>
      </select>
    </div>

    <div class="field">
      <div class="packages-header">
        <label>Packages</label>
        <button type="button" class="add-package-btn" id="addPackageBtn">+ Add another package</button>
      </div>
      <div id="packagesContainer"></div>
    </div>

    <button type="submit" id="submitBtn">Generate labels</button>
    <div class="spinner" id="spinner">Talking to FedEx&hellip; this can take a few seconds per package.</div>
  </form>

  <div class="message" id="resultMessage"></div>

<script>
  let currentOrderId = null;
  let packageCount = 0;

  const packagesContainer = document.getElementById("packagesContainer");
  const addPackageBtn = document.getElementById("addPackageBtn");

  const PACKAGE_TYPES = [
    ["YOUR_PACKAGING", "Your packaging"],
    ["FEDEX_ENVELOPE", "FedEx Envelope"],
    ["FEDEX_BOX", "FedEx Box"],
    ["FEDEX_SMALL_BOX", "FedEx Small Box"],
    ["FEDEX_MEDIUM_BOX", "FedEx Medium Box"],
    ["FEDEX_LARGE_BOX", "FedEx Large Box"],
    ["FEDEX_PAK", "FedEx Pak"],
    ["FEDEX_TUBE", "FedEx Tube"]
  ];

  function addPackageRow() {
    packageCount += 1;
    const rowId = "pkg_" + packageCount;
    const row = document.createElement("div");
    row.className = "package-row";
    row.dataset.rowId = rowId;

    let packageTypeOptions = '<option value="" disabled selected>Select packaging</option>';
    PACKAGE_TYPES.forEach(function (pt) {
      packageTypeOptions += '<option value="' + pt[0] + '">' + pt[1] + "</option>";
    });

    row.innerHTML =
      '<span class="package-label">Package ' + packageCount + '</span>' +
      '<div class="weight-row">' +
        '<input type="number" class="pkg-weight weight-input" min="0.01" step="0.01" placeholder="Weight, e.g. 2.5" required />' +
        '<select class="pkg-weight-unit weight-unit" required>' +
          '<option value="LB">lb</option>' +
          '<option value="KG">kg</option>' +
        "</select>" +
      "</div>" +
      '<select class="pkg-type" required>' + packageTypeOptions + "</select>" +
      '<button type="button" class="remove-package-btn">Remove</button>';

    row.querySelector(".remove-package-btn").addEventListener("click", function () {
      row.remove();
    });

    packagesContainer.appendChild(row);
  }

  addPackageBtn.addEventListener("click", addPackageRow);
  addPackageRow(); // start with one row

  // 1. Initialize the Zoho Widget SDK and read the record we were opened from.
  ZOHO.embeddedApp.on("PageLoad", function (data) {
    currentOrderId = Array.isArray(data.EntityId) ? data.EntityId[0] : data.EntityId;
    if (currentOrderId) {
      document.getElementById("orderTag").style.display = "inline-flex";
      document.getElementById("orderIdValue").textContent = currentOrderId;
    }
  });

  ZOHO.embeddedApp.init();

  const form = document.getElementById("shipmentForm");
  const submitBtn = document.getElementById("submitBtn");
  const spinner = document.getElementById("spinner");
  const resultMessage = document.getElementById("resultMessage");

  function showMessage(text, type) {
    resultMessage.textContent = text;
    resultMessage.className = "message visible " + type;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    if (!currentOrderId) {
      showMessage("Could not detect the order this widget was opened from. Reopen it from the Order record.", "error");
      return;
    }

    const service_type = document.getElementById("service_type").value;
    const rows = Array.from(packagesContainer.querySelectorAll(".package-row"));

    if (!service_type) {
      showMessage("Please select a FedEx service type.", "error");
      return;
    }
    if (rows.length === 0) {
      showMessage("Add at least one package.", "error");
      return;
    }

    const weights = [];
    const weightUnits = [];
    const packageTypes = [];

    for (const row of rows) {
      const weight = row.querySelector(".pkg-weight").value;
      const weightUnit = row.querySelector(".pkg-weight-unit").value;
      const packageType = row.querySelector(".pkg-type").value;

      if (!weight || parseFloat(weight) <= 0 || !packageType) {
        showMessage("Fill in weight and packaging type for every package.", "error");
        return;
      }

      weights.push(weight);
      weightUnits.push(weightUnit);
      packageTypes.push(packageType);
    }

    submitBtn.disabled = true;
    spinner.classList.add("visible");
    resultMessage.classList.remove("visible");

    // 2. Call the Deluge function, sending pipe-delimited lists (one entry per package).
    const req = {
      functionname: "generatefedexshippinglabel1_1", // update to match your function's REST API name exactly
      arguments: {
        order_id: currentOrderId,
        service_type: service_type,
        weights: weights.join("|"),
        weight_units: weightUnits.join("|"),
        package_types: packageTypes.join("|")
      }
    };

    ZOHO.CRM.FUNCTIONS.execute(req.functionname, req.arguments)
      .then(function (response) {
        submitBtn.disabled = false;
        spinner.classList.remove("visible");

        const output = response && response.details ? response.details.output : response;

        if (typeof output === "string" && output.toLowerCase().indexOf("error") !== -1) {
          showMessage(output, "error");
        } else {
          showMessage(output || "Labels generated.", "success");
        }
      })
      .catch(function (err) {
        submitBtn.disabled = false;
        spinner.classList.remove("visible");
        showMessage("Something went wrong calling the function: " + JSON.stringify(err), "error");
      });
  });
</script>

</body>
</html>
